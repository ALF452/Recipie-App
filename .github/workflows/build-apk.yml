name: Build Demo APK

on:
  push:
    branches:
      - claude/android-recipe-app-0is30s
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests (100-recipe/pantry/photo stress test)
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testReleaseUnitTest/

      - name: Build minified, resource-shrunk release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename for the stable demo asset name
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-debug.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-cookbook-release-apk
          path: app/build/outputs/apk/release/app-debug.apk

      - name: Publish APK to demo release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-apk
          name: "My Cookbook - Demo APK"
          body: |
            Auto-built demo APK of My Cookbook from the latest push to `claude/android-recipe-app-0is30s`.

            This is a minified, resource-shrunk release build (R8 code
            shrinking + unused-resource removal), signed with an
            auto-generated debug key so it installs directly without a Play
            Store account. Asset is still named `app-debug.apk` to keep the
            download link stable across builds.

            **To install:** download `app-debug.apk` to your Android phone
            (Android 8.0+), open it, and allow installs from unknown sources
            when prompted.

            This asset is replaced on every push — always the latest build.
          files: app/build/outputs/apk/release/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
